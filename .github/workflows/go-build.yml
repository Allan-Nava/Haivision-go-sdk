name: Go build
#
# Compila sulla versione minima dichiarata in go.mod. Il floor va testato, altrimenti la
# direttiva `go` è una promessa non verificata: basta una dipendenza che alza la sua per
# romperlo in silenzio.
#
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
#
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod richiede go 1.25.0 (x/net con il fix HTTP/2 e validator/v10 lo impongono):
        # versioni precedenti non compilano affatto. Aggiungere 1.26.x quando esce.
        go-version: [ '1.25.x' ]
    steps:
    - uses: actions/checkout@v4
    #
    - name: Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        # cache dei moduli attiva: prima era disabilitata e `cache-dependency-path` puntava a
        # `subdir/go.sum`, un path inesistente residuo di template
        cache: true
        cache-dependency-path: go.sum
    #
    - name: Build
      run: go build -v ./...
    #
  #
#
