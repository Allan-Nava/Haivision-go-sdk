name: Go build
#
# Compila sulla versione minima dichiarata in go.mod (1.18: l'SDK usa i generics) e sulle
# release correnti. Il floor va testato, altrimenti `go 1.18` in go.mod è una promessa non
# verificata: basta una dipendenza che alza la sua direttiva per romperlo in silenzio.
#
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
#
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.18.x', '1.23.x', '1.24.x', '1.25.x' ]
    steps:
    - uses: actions/checkout@v4
    #
    - name: Setup Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        # cache dei moduli attiva: prima era disabilitata e `cache-dependency-path` puntava a
        # `subdir/go.sum`, un path inesistente residuo di template
        cache: true
        cache-dependency-path: go.sum
    #
    - name: Build
      run: go build -v ./...
    #
  #
#
